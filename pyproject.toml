[project]
name = "matopiba"
version = "0.1.0"
description = "Expansão agrícola no Matopiba e qualidade de vida: pipeline de dados e análise"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "pyarrow",
    "geopandas",
    "geobr",
    "earthengine-api",
    "geemap",
    "basedosdados",
    "google-cloud-bigquery",
    "rasterio",
    "rasterstats",
    "pyyaml",
    "linearmodels",
    "statsmodels",
    "differences",
    "matplotlib",
    "python-calamine",
    "xlrd",
    "tabulate",
    "pypdf",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matopiba"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
